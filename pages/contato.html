<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Confeitaria Sempre Doce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contato.css">
</head>

<body>
    <header>
        <div class="div-logo">
            <img class="logotipo" src="../IMG/logo_sempre_doce.png" alt="Logo da Confeitaria Sempre Doce">
        </div>
        <div class="div-menu">
            <h1>CONFEITARIA SEMPRE DOCE</h1>
            <nav aria-label="Navegação principal">
                <ul class="menu">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina-conteudo">
        <h2>Entre em contato</h2>
        <p>Faça sua reserva ou tire suas dúvidas. Será um prazer atender você!</p>
        <form class="formulario-contato" action="#" method="post">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

            <button type="submit">Enviar mensagem</button>
        </form>
    </main>

    <footer>&copy; 2026 Confeitaria Sempre Doce. Todos os direitos reservados.</footer>
</body>

</html>
